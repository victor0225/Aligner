display_information:
  name: Subjector Bot
  description: Meeting-to-task coordination bot for Subjector
  background_color: "#4A154B"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Subjector Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - files:read
      - files:write
      - im:history
      - im:read
      - im:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://subjector.onrender.com/slack/events
    bot_events:
      - message.channels
      - message.im
      - file_shared
  interactivity:
    is_enabled: true
    request_url: https://subjector.onrender.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
